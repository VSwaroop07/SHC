apiVersion: v1
kind: ServiceAccount
metadata:
  name: selfheal-sa

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: selfheal-role
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: selfheal-binding
subjects:
- kind: ServiceAccount
  name: selfheal-sa
roleRef:
  kind: Role
  name: selfheal-role
  apiGroup: rbac.authorization.k8s.io
